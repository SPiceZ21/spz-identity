<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Creation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="hidden">
        <div class="overlay"></div>
        <div class="modal">
            <div class="header">
                <h1>NEW DRIVER <span>REGISTRATION</span></h1>
                <p>Establish your identity in the SPiceZ Racing Framework</p>
            </div>
            
            <div class="form-group">
                <label for="username">RACER ALIAS</label>
                <input type="text" id="username" placeholder="Enter your username" autocomplete="off" maxlength="20">
                <span class="error-msg" id="error-username"></span>
            </div>

            <div class="form-group">
                <label>SELECT MODEL BASE</label>
                <div class="gender-selection">
                    <div class="gender-card active" data-gender="0" id="gender-male">
                        <div class="icon">M</div>
                        <span>MALE</span>
                    </div>
                    <div class="gender-card" data-gender="1" id="gender-female">
                        <div class="icon">F</div>
                        <span>FEMALE</span>
                    </div>
                </div>
            </div>

            <div class="footer">
                <button id="submit-btn">
                    <span class="btn-text">INITIALIZE IDENTITY</span>
                    <div class="btn-glow"></div>
                </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
